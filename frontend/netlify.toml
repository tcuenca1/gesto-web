# Publicación en Netlify (alternativa a Vercel).
[build]
  command = "npm run build"
  publish = "dist/gestoweb/browser"

# /api se reenvía al backend: así el navegador no necesita CORS.
[[redirects]]
  from = "/api/*"
  to = "https://CAMBIAR-POR-TU-BACKEND.up.railway.app/api/:splat"
  status = 200
  force = true

# Las rutas de Angular (/reconocer, /historial…) devuelven index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=()"
